# ╔══════════════════════════════════════════════════════════════╗
# ║                  ItemLog  –  Konfigürasyon                   ║
# ║        Spigot / Paper / Purpur  1.16.5 – 1.21.x              ║
# ╚══════════════════════════════════════════════════════════════╝
#
#  Değişiklikten sonra:  /itemlog reload   (veya /itemlogreload)
#  NOT: "database" bölümündeki değişiklikler için sunucu yeniden
#       başlatılmalıdır; diğer her şey reload ile anında uygulanır.

config-version: 2

# ┌──────────────────────────────────────────────────────────────┐
# │                       VERİTABANI                             │
# └──────────────────────────────────────────────────────────────┘
database:
  # sqlite  → tek dosya, kurulum gerektirmez (önerilen)
  # mysql   → MySQL / MariaDB (çok sunuculu / büyük ağlar için)
  type: sqlite

  sqlite:
    # plugins/ItemLog/ klasörü içinde oluşturulur
    file: itemlog.db

  mysql:
    host: 127.0.0.1
    port: 3306
    database: itemlog
    username: root
    password: ''
    # Eş zamanlı bağlantı sayısı (3–10 arası önerilir)
    pool-size: 5
    # Havuzdan bağlantı beklerken en fazla kaç ms beklensin
    connection-timeout: 5000
    # JDBC URL'ye eklenecek ek parametreler
    properties: 'useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true'

# ┌──────────────────────────────────────────────────────────────┐
# │                      GENEL AYARLAR                           │
# └──────────────────────────────────────────────────────────────┘
settings:
  # Hangi olaylar loglansın?
  log-drops: true          # Oyuncunun yere item atması (Q / envanterden sürükleme)
  log-pickups: true        # Oyuncunun yerden item alması
  log-deaths: true         # Ölünce düşen itemler

  # Kimsenin atmadığı (mob düşüşü, sandık kırılması vb.) takipli itemler
  # yerden alındığında da log tutulsun mu?
  log-unlinked-pickups: true

  # Detay ekranında shulker box içeriği listelensin mi?
  show-shulker-contents: true

  # Kaç günden eski kayıtlar otomatik silinsin? 0 = asla silme
  retention-days: 0

  # Tab tamamlama için oyuncu adı önbelleği kaç saniyede bir yenilensin
  name-cache-refresh-seconds: 300

  # Tarih biçimi (Java DateTimeFormatter) ve saat dilimi
  # timezone: "system" ya da örn. "Europe/Istanbul"
  date-format: 'dd/MM/yyyy HH:mm:ss'
  timezone: system

messages:
  prefix: '&8[&5ItemLog&8] '

# ┌──────────────────────────────────────────────────────────────┐
# │                  TAKİP EDİLEN MATERYALLER                    │
# └──────────────────────────────────────────────────────────────┘
#  Sadece bu listedeki itemler loglanır.
#  • Tam ad:            NETHERITE_SWORD
#  • Joker karakter:    NETHERITE_*      (tüm netherite eşyalar)
#  • Özel kısayol:      ALL_SHULKER_BOXES (17 renk shulker)
#  Sunucu sürümünde olmayan materyaller (örn. 1.16'da MACE) uyarısız atlanır.
#  Materyal listesi: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
tracked-items:
  # Deri zırh
  - LEATHER_HELMET
  - LEATHER_CHESTPLATE
  - LEATHER_LEGGINGS
  - LEATHER_BOOTS

  # Netherite ekipman (kılıç, kazma, balta, zırh...)
  - NETHERITE_*

  # Nadir / değerli
  - ELYTRA
  - TOTEM_OF_UNDYING
  - TRIDENT
  - MACE
  - GOLDEN_APPLE
  - ENCHANTED_GOLDEN_APPLE
  - HEART_OF_THE_SEA
  - NETHER_STAR
  - DRAGON_EGG
  - BEACON

  # Sunucuya özel
  - FEATHER
  - NETHER_WART_BLOCK

  # Tüm shulker kutuları
  - ALL_SHULKER_BOXES

# ┌──────────────────────────────────────────────────────────────┐
# │                DÜNYA / KOORDİNAT FİLTRESİ                    │
# └──────────────────────────────────────────────────────────────┘
#  Boş bırakılırsa ( tracked-zones: [] ) her yer loglanır.
#  Bölgelerden herhangi biri eşleşirse log alınır.
#  min-x: ALL  → o dünyanın tamamı
#  min > max yazılsa da otomatik düzeltilir.
#  Not: Loglanmış bir item bölge dışında alınsa bile alış kaydı tutulur
#       (zincir kopmasın diye).
tracked-zones:
  - world: world
    min-x: -5000
    max-x: 5000
    min-y: -64
    max-y: 320
    min-z: -5000
    max-z: 5000

  - world: world_nether
    min-x: -1000
    max-x: 1000
    min-y: 0
    max-y: 256
    min-z: -1000
    max-z: 1000

  - world: world_the_end
    min-x: ALL

  # Örnek: bir dünyanın tamamı
  # - world: pvp_arena
  #   min-x: ALL
